<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Painting Skin Theme</title>
<style>
  /* 界面 = Superdesign C1 v8「情报页 · 抽屉」：
     左列是**整身动态立绘**（原版 webm，VP9+alpha，无文字压图），
     中列是**抽屉条**——全部皮肤排成一条滑轨，预选格在中轴线上、两侧逐级变矮（cover-flow），
     点格/箭头只改预选（滑轨平移 + 高度渐变），注入只由底栏主按钮触发；
     「使用中」徽章标记实际已注入的那只皮肤。
     底栏从左到右：明暗三态 → 桌宠 → ZCode 路径行 → 撤下皮肤 / 注入并挂载。
     无标题栏：顶部 34px 与左列整块都可拖动窗口，× − 在右上角。
     不引任何 CDN：面板要离线可用，图标用内联 SVG。 */
  :root {
    --base-100: #242426;
    --base-200: #1b1c1d;
    --base-300: #171718;
    --gold-bright: #f4cc6d;
    --gold-mid: #d8a166;
    --gold-mid2: #c9a227;
    --ink: #f6e9dc;
    --ink-sec: #a3a2a2;
    --ink-sec2: #9ea29d;
    --ink-dim: #5a5858;
    --ok: #57b98a;
    --bad: #d96a6a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; flex-direction: column; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 40%, #202124 0%, #17181a 55%, #121315 100%);
    color: var(--ink);
    font: 13px/1.6 "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button { font: inherit; cursor: pointer; }

  /* 无系统标题栏：顶部条 + 左列立绘区都可拖动 */
  .dragbar { position: fixed; top: 0; left: 0; right: 0; height: 34px; -webkit-app-region: drag; z-index: 10; }
  .winbtns { position: fixed; top: 8px; right: 12px; z-index: 40; display: flex; gap: 2px; -webkit-app-region: no-drag; }
  .winbtns button {
    width: 26px; height: 24px; border: 0; background: none;
    color: var(--ink-dim); font-size: 14px; line-height: 1;
  }
  .winbtns button:hover { color: var(--ink); }
  .winbtns #win-close:hover { color: var(--bad); }

  .main { flex: 1; display: flex; min-height: 0; overflow: hidden; }

  /* ---------- 左列：整身动态立绘 ---------- */
  .hero {
    width: 500px; flex: none; position: relative;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 40px 32px 32px;
    -webkit-app-region: drag;
  }
  .hero-media { position: relative; width: 100%; height: 100%; }
  .hero-media img,
  .hero-media video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; object-position: center bottom;
    filter: drop-shadow(0 14px 30px rgb(0 0 0 / 60%));
    pointer-events: none;
  }
  .hero-media img { z-index: 1; }
  .hero-media video { z-index: 2; }
  .hero-caption { position: absolute; left: 32px; bottom: 32px; z-index: 3; }
  .hero-caption .tick { display: block; width: 64px; height: 2px; background: var(--gold-mid2); margin-bottom: 10px; }
  .hero-caption span { font-size: 11px; letter-spacing: .3em; color: var(--ink-sec); }
  .hero-empty {
    position: absolute; left: 0; right: 0; top: 42%; z-index: 3;
    text-align: center; color: var(--ink-sec); font-size: 12px;
  }

  /* ---------- 中列：抽屉滑轨（cover-flow） ----------
     全部皮肤排在一条绝对定位的滑轨上，平移滑轨让预选格落在中轴线；
     离中轴越远格越矮越窄：l0(预选) → l1 → l2 → l3+。宽高与位移都走同一缓动，
     切换时整条像抽屉一样滚过去。 */
  .strip-zone {
    flex: 1; min-width: 0; position: relative;
    display: flex; flex-direction: column; justify-content: center;
    padding: 40px 12px 32px;
  }
  .strip-row { display: flex; align-items: center; gap: 16px; height: 72%; }
  .arrow {
    width: 32px; height: 32px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 1px solid rgb(255 255 255 / 20%); border-radius: 50%;
    color: var(--ink-sec); transition: color 160ms ease, border-color 160ms ease;
  }
  .arrow:hover { color: var(--gold-bright); border-color: var(--gold-mid); }
  .strip-viewport { flex: 1; min-width: 0; height: 100%; position: relative; overflow: hidden; }
  .strip-track {
    position: absolute; top: 0; left: 0; height: 100%;
    display: flex; align-items: center; gap: 8px;
    transition: transform 450ms cubic-bezier(.22, .61, .36, 1);
    will-change: transform;
  }
  .slat {
    position: relative; overflow: hidden; flex: none;
    background: var(--base-200);
    border: 1px solid rgb(255 255 255 / 10%);
    filter: brightness(.78) saturate(.45);
    cursor: pointer;
    transition:
      width 450ms cubic-bezier(.22, .61, .36, 1),
      height 450ms cubic-bezier(.22, .61, .36, 1),
      border-color 450ms ease, filter 450ms ease;
  }
  .slat img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: top; pointer-events: none;
  }
  .slat-l0 { width: 210px; height: 100%; background: var(--base-100); border-color: var(--gold-mid); filter: none; cursor: default; }
  .slat-l1 { width: 86px; height: 84%; }
  .slat-l2 { width: 72px; height: 70%; }
  .slat-l3 { width: 64px; height: 58%; }
  .slat-l1 img, .slat-l2 img, .slat-l3 img { opacity: .8; }
  .slat:hover { filter: brightness(.95) saturate(.7); }
  .slat-l0:hover { filter: none; }
  .badge {
    position: absolute; top: 16px; left: 16px;
    font-size: 10px; letter-spacing: .25em; padding: 4px 8px;
    color: var(--gold-bright); background: rgb(201 162 39 / 20%);
    border: 1px solid rgb(216 161 102 / 30%);
  }
  .badge-dot {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold-bright);
    box-shadow: 0 0 6px rgb(244 204 109 / 80%);
  }
  .progress { position: absolute; left: 64px; right: 64px; bottom: 8px; height: 1px; background: rgb(255 255 255 / 10%); }
  .progress i { display: block; height: 100%; background: var(--gold-mid); transition: margin-left 450ms cubic-bezier(.22, .61, .36, 1); }

  /* ---------- 底栏 ---------- */
  .bottom {
    height: 72px; flex: none; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    background: var(--base-200);
    border-top: 1px solid rgb(255 255 255 / 10%);
    font-size: 11px;
    /* 窗口缩窄时文字按钮不许逐字换行：三侧固定，由中间路径组吸收挤压 */
    white-space: nowrap;
  }
  .modes { display: flex; gap: 24px; flex: none; }
  .modes button {
    background: none; border: 0; border-bottom: 1px solid transparent;
    padding: 0 0 4px; letter-spacing: .25em;
    color: var(--ink-dim); transition: color 160ms ease;
  }
  .modes button:hover { color: var(--ink-sec); }
  .modes button[aria-pressed="true"] { color: var(--gold-bright); border-bottom-color: var(--gold-bright); }

  .pet { display: flex; align-items: center; gap: 8px; letter-spacing: .25em; flex: none; margin: 0 20px; }
  .pet-label { color: var(--ink-sec2); }
  .pet-state { color: var(--ink-dim); }
  .pet-name { color: var(--ink); max-width: 96px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pet-nav {
    width: 20px; height: 20px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 1px solid rgb(255 255 255 / 10%);
    color: var(--ink-sec); transition: color 160ms ease, border-color 160ms ease;
  }
  .pet-nav:hover { color: var(--gold-bright); border-color: var(--gold-mid); }

  .target { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; margin: 0 16px; }
  .target .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); flex: none; }
  .target .dot.ok { background: var(--ok); }
  .target-label { letter-spacing: .25em; color: var(--ink-sec); flex: none; }
  .target-path { font-family: Consolas, monospace; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 176px; }
  .target-note { color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
  .target button {
    flex: none; padding: 4px 8px; background: none;
    border: 1px solid rgb(255 255 255 / 10%);
    color: var(--ink-sec); transition: color 160ms ease, border-color 160ms ease;
  }
  .target button:hover { color: var(--gold-bright); border-color: var(--gold-mid); }

  .actions { display: flex; align-items: center; gap: 24px; flex: none; }
  .ghost { background: none; border: 0; letter-spacing: .25em; color: var(--ink-sec); transition: color 160ms ease; }
  .ghost:hover { color: var(--gold-bright); }
  .primary {
    background: var(--gold-bright); color: var(--base-300);
    font-weight: 700; letter-spacing: .1em;
    padding: 10px 32px; border: 0;
    max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background 160ms ease;
  }
  .primary:hover { background: #fff0b3; }
  .primary:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div class="dragbar"></div>
  <div class="winbtns">
    <button id="win-min" title="最小化">−</button>
    <button id="win-close" title="最小化到系统托盘">×</button>
  </div>

  <div class="main">
    <!-- 左列：整身动态立绘（跟预选走；webm 有 alpha 时盖在静帧上，加载好就隐藏静帧） -->
    <div class="hero">
      <div class="hero-media">
        <img id="hero-still" alt="" draggable="false">
        <video id="hero-video" autoplay loop muted playsinline></video>
      </div>
      <div class="hero-caption"><i class="tick"></i><span id="hero-name">加载中…</span></div>
      <div class="hero-empty" id="hero-empty" hidden>该皮肤没有立绘素材</div>
    </div>

    <!-- 中列：抽屉滑轨（点格/箭头 = 预选，滑轨滚动；注入在底栏主按钮） -->
    <div class="strip-zone">
      <div class="strip-row">
        <button class="arrow" id="skin-prev" title="预选上一个">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="strip-viewport" id="strip-viewport">
          <div class="strip-track" id="strip-track"></div>
        </div>
        <button class="arrow" id="skin-next" title="预选下一个">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="progress"><i id="prog-fill"></i></div>
    </div>
  </div>

  <footer class="bottom">
    <div class="modes" id="modes">
      <button data-mode="dark">暗夜</button>
      <button data-mode="light">日间</button>
      <button data-mode="auto">跟随系统</button>
    </div>

    <div class="pet">
      <span class="pet-label">桌宠</span>
      <button class="pet-nav" id="pet-prev" title="上一个宠物">
        <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <span class="pet-name" id="pet-cycle">—</span>
      <button class="pet-nav" id="pet-next" title="下一个宠物">
        <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <span class="pet-state">等待</span>
    </div>

    <div class="target" id="target">
      <span class="dot" id="target-dot"></span>
      <span class="target-label">ZCode</span>
      <span class="target-path" id="target-path">探测中…</span>
      <span class="target-note" id="target-note"></span>
      <button id="target-default" title="回到默认路径（丢掉手动指定的路径）">默认路径</button>
      <button id="target-pick" title="手动选择 ZCode 的可执行文件">选择…</button>
    </div>

    <div class="actions">
      <button class="ghost" id="remove">撤下皮肤</button>
      <button class="primary" id="apply">注入并挂载</button>
    </div>
  </footer>

<script>
  /* 面板逻辑：只通过 IPC 跟主进程说话，不直接碰 CDP。
     在浏览器里直接打开本文件时走内置示例（素材走相对路径，便于调界面、
     也能真正演示"预选换立绘"），此时不触发任何注入。 */
  let ipcRenderer = null;
  try { ipcRenderer = require('electron').ipcRenderer; } catch (e) { ipcRenderer = null; }

  const el = (id) => document.getElementById(id);

  /* 浏览器预览用：5 套本地主题，与实机一致——有 webm 播 webm，没有回退静帧 */
  const demo = {
    skins: [
      { id: 'ines-line', name: '伊内丝 · ines', author: '（浏览器预览）', url: '../themes/ines-line/assets/character-still.webp', motion: '../themes/ines-line/assets/character-motion.webm' },
      { id: 'c581-line', name: '霜蓝 · c581', author: '（浏览器预览）', url: '../themes/c581-line/assets/character-still.webp', motion: '../themes/c581-line/assets/character-motion.webm' },
      { id: 'dorothy-line', name: '桃乐丝 · dorothy', author: '（浏览器预览）', url: '../themes/dorothy-line/assets/character-still.webp', motion: '../themes/dorothy-line/assets/character-motion.webm' },
      { id: 'moran-line', name: '莫兰 · moran', author: '（浏览器预览）', url: '../themes/moran-line/assets/character-still.webp', motion: '../themes/moran-line/assets/character-motion.webm' },
      { id: 'sakura-line', name: '樱 · sakura', author: '（浏览器预览）', url: '../themes/sakura-line/assets/character-still.webp', motion: '../themes/sakura-line/assets/character-motion.webm' },
    ],
    skinIndex: 1,
    injectedId: 'c581-line',
    mode: 'dark',
    pets: [{ id: 'none', name: '不显示' }, { id: 'choten-chan', name: '超天酱' }, { id: 'mint', name: '薄荷' }, { id: 'kaguyaa', name: '辉夜' }],
    petIndex: 1,
    status: { injected: false, port: 9344, rootTheme: 'dark', target: '（浏览器预览：没有目标应用）' },
    pump: { running: false, port: 9344 },
    app: { exePath: 'D:\\Zcode\\ZCode.exe', source: '（浏览器预览）', processName: 'ZCode.exe', running: true, endpointReady: false, configPath: '~/.painting-skin-theme/app.json' },
    preview: true,
  };
  /* demo 的 portraits/motions/portrait 每次现算，保持与实机快照同构 */
  function demoState() {
    return {
      ...demo,
      portraits: Object.fromEntries(demo.skins.map((s) => [s.id, s.url])),
      motions: Object.fromEntries(demo.skins.map((s) => [s.id, s.motion || null])),
    };
  }

  async function invoke(channel, ...args) {
    if (ipcRenderer) return ipcRenderer.invoke(channel, ...args);
    if (channel === 'panel:snapshot') return demoState();
    if (channel === 'panel:cycle-pet') {
      demo.petIndex = (demo.petIndex + (args[0] >= 0 ? 1 : -1) + demo.pets.length) % demo.pets.length;
      return { ...demoState() };
    }
    if (channel === 'panel:set-mode') return { ...demoState(), mode: args[0], applied: { ok: true, checks: {} } };
    if (channel === 'panel:apply') {
      demo.injectedId = demo.skins[selIndex]?.id ?? demo.injectedId;
      return { ...demoState(), applied: { ok: true, checks: {} } };
    }
    if (channel === 'panel:remove') return { ...demoState(), removed: { ok: true, changed: false } };
    if (channel === 'panel:defaults') return { ...demoState(), resolved: { candidates: [{ path: 'D:\\Zcode\\ZCode.exe', source: '默认路径', chosen: true }], saved: { exePath: 'D:\\Zcode\\ZCode.exe' } } };
    if (channel === 'panel:pick-exe') return { ...demoState(), picked: 'D:\\Zcode\\ZCode.exe', saved: { saved: { exePath: 'D:\\Zcode\\ZCode.exe' } } };
    if (channel === 'panel:relaunch-apply') return { ...demoState(), relaunched: { ok: true }, applied: { ok: true, checks: {} } };
    return null;
  }

  let snapshot = null;
  /** 预选（只影响预览与主按钮将注入谁）；null = 尚未初始化，跟随快照的当前皮肤 */
  let selIndex = null;

  /* 主进程给的是绝对路径，面板是 file:// 页面，转成 file URL 才能引 */
  function fileUrl(p) {
    if (!p) return '';
    return 'file:///' + String(p).replace(/\\/g, '/').replace(/#/g, '%23').replace(/\?/g, '%3F');
  }

  /* 左列立绘：有 webm 就播（真正 alpha），视频起播前/失败时露出下面的静帧 */
  function paintHero(state, skin) {
    const video = el('hero-video');
    const img = el('hero-still');
    const motion = state.preview ? (skin && skin.motion) : fileUrl((state.motions || {})[skin && skin.id] || '');
    const still = state.preview ? (skin && skin.url) : fileUrl((state.portraits || {})[skin && skin.id] || '');
    const showStill = () => {
      video.style.display = 'none';
      if (still && img.getAttribute('src') !== still) img.setAttribute('src', still);
      img.style.display = still ? '' : 'none';
    };
    video.onplaying = () => { img.style.display = 'none'; };
    video.onerror = showStill;
    if (motion) {
      if (video.getAttribute('src') !== motion) {
        if (still) img.setAttribute('src', still);
        img.style.display = still ? '' : 'none';
        video.muted = true;
        video.setAttribute('src', motion);
        video.load();
        video.play().catch(() => { /* 自动播放被拦时静帧还在，不算坏 */ });
      }
      video.style.display = '';
    } else {
      showStill();
    }
    el('hero-empty').hidden = Boolean(still || motion);
  }

  /* ---------- 抽屉滑轨 ----------
     全部皮肤一次建成；每次只改各格的层级 class（宽高随离中轴的距离变化，CSS 过渡出扇形）
     并把滑轨平移到"预选格中心 = 视口中轴线"。位移按各格最终宽度算（宽度只由层级决定，可预知）。 */
  const LEVEL_W = [210, 86, 72, 64];   // l0 预选 / l1 / l2 / l3 及更远
  const GAP = 8;
  const levelOf = (dist) => Math.min(dist, 3);
  const widthOf = (i, sel) => LEVEL_W[levelOf(Math.abs(i - sel))];

  function buildStrip(total) {
    const track = el('strip-track');
    while (track.children.length > total) track.lastChild.remove();
    while (track.children.length < total) {
      const cell = document.createElement('div');
      cell.className = 'slat slat-l3';
      const im = document.createElement('img');
      im.draggable = false; im.alt = '';
      cell.appendChild(im);
      cell.addEventListener('click', () => selectSkin([...cell.parentNode.children].indexOf(cell)));
      track.appendChild(cell);
    }
    return track;
  }

  function paintStrip(state, skins, sel) {
    const viewport = el('strip-viewport');
    const track = el('strip-track');
    const total = skins.length;
    if (!total) { track.innerHTML = ''; return; }
    const cells = buildStrip(total).children;
    const injectedId = state.preview ? demo.injectedId : state.injectedId;
    for (let i = 0; i < total; i++) {
      const cell = cells[i];
      const s = skins[i];
      const lvl = levelOf(Math.abs(i - sel));
      cell.className = 'slat slat-l' + lvl;
      cell.title = s.name + (s.author ? ` · ${s.author}` : '');
      const im = cell.querySelector('img');
      const src = state.preview ? s.url : fileUrl((state.portraits || {})[s.id] || '');
      if (src && im.getAttribute('src') !== src) im.setAttribute('src', src);
      im.style.display = src ? '' : 'none';
      /* 「使用中」跟实际注入走：在中轴格上给全徽章，收拢格上给金点。
         皮肤从拉开变收拢（或反向）时必须降级/升级，否则上一态的标记会残留。 */
      const isInj = s.id === injectedId;
      const badge = cell.querySelector('.badge');
      const dot = cell.querySelector('.badge-dot');
      if (!isInj) { if (badge) badge.remove(); if (dot) dot.remove(); }
      else if (lvl === 0) {
        if (dot) dot.remove();
        if (!badge) cell.insertAdjacentHTML('beforeend', '<span class="badge">使用中</span>');
      } else {
        if (badge) badge.remove();
        if (!dot) cell.insertAdjacentHTML('beforeend', '<span class="badge-dot"></span>');
      }
    }
    /* 滑轨位移：预选格中心对齐视口中轴线（首尾两端允许留空，抽屉拉到头就是空的） */
    const vw = viewport.clientWidth || 1;
    let leftSum = 0;
    for (let i = 0; i < sel; i++) leftSum += widthOf(i, sel) + GAP;
    const offset = leftSum + widthOf(sel, sel) / 2 - vw / 2;
    track.style.transform = `translateX(${(-offset).toFixed(1)}px)`;
    /* 进度线：窗口宽度≈可见格数，位移≈预选位置 */
    const fill = el('prog-fill');
    const win = Math.min(5, total);
    fill.style.width = (win / total) * 100 + '%';
    fill.style.marginLeft = (Math.min(Math.max(0, sel - 2), Math.max(0, total - win)) / total) * 100 + '%';
  }

  /* 预选切换：只改预览（英雄位 + 滑轨滚动），绝不触发注入 */
  function selectSkin(i) {
    const total = (snapshot && snapshot.skins || []).length;
    if (!total) return;
    const next = Math.min(Math.max(0, i), total - 1);
    if (next === selIndex) return;
    selIndex = next;
    paint(snapshot);
  }

  function paint(state) {
    if (!state) return;
    snapshot = state;
    const skins = state.skins || [];
    const cur = Math.max(0, Number(state.skinIndex || 0));
    if (selIndex == null || selIndex > skins.length - 1) selIndex = cur;
    const skin = skins[selIndex] || null;
    el('hero-name').textContent = skin ? skin.name : '没有可用主题';
    paintHero(state, skin);
    paintStrip(state, skins, selIndex);

    const pets = state.pets || [];
    const pet = pets[state.petIndex] || null;
    el('pet-cycle').textContent = pet ? pet.name : '—';

    document.querySelectorAll('#modes button').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset.mode === (state.mode || 'auto')));
    });

    /* 目标应用行：绿点 = 调试端口可用（能直接注入）；红点 = 没有调试口或没在跑。
       后缀原因（运行中·无调试口 / 未运行）放点旁的小字与 title 里。 */
    const appInfo = state.app || {};
    el('target-dot').className = 'dot' + (appInfo.endpointReady ? ' ok' : '');
    if (appInfo.exePath) {
      const suffix = appInfo.endpointReady ? '' : (appInfo.running ? '（运行中 · 无调试口）' : '（未运行）');
      el('target-path').textContent = appInfo.exePath;
      el('target-note').textContent = suffix;
      el('target-path').title = `${appInfo.exePath}${suffix}\n来源：${appInfo.source || '未知'}｜配置：${appInfo.configPath || ''}`;
    } else {
      el('target-path').textContent = '未找到安装路径';
      el('target-note').textContent = '';
      el('target-path').title = '点"默认路径"或"选择…"指定 ZCode 位置' + (appInfo.configPath ? `｜配置文件：${appInfo.configPath}` : '');
    }

    /* 状态与复核结果只在主按钮上给一句短反馈（见 flashButton） */
    if (!flash.active) el('apply').textContent = applyLabel();
  }

  /* 主按钮的两副面孔：平时是"注入并挂载"，上一次注入因为缺调试端口失败时变成"重启 ZCode 并注入" */
  let pendingRelaunch = false;
  function applyLabel() {
    if (pendingRelaunch) return '重启 ZCode 并注入';
    return snapshot && snapshot.status && snapshot.status.injected ? '重新注入' : '注入并挂载';
  }

  /* 短反馈：写在主按钮上，几秒后复原。这样不占版面，也不新增文字块 */
  const flash = { active: false, timer: 0 };
  function flashButton(text, ok, holdMs) {
    const button = el('apply');
    flash.active = true;
    button.textContent = text;
    button.title = text;
    button.style.filter = ok ? '' : 'hue-rotate(-40deg) saturate(1.2)';
    clearTimeout(flash.timer);
    flash.timer = setTimeout(() => {
      flash.active = false;
      button.style.filter = '';
      button.title = '';
      button.textContent = applyLabel();
    }, holdMs || 3200);
  }
  async function refresh() {
    paint((await invoke('panel:snapshot')) || demoState());
  }

  async function act(channel, args, note) {
    el('apply').textContent = note + '…';
    const result = (await invoke(channel, ...(args || []))) || { ...demoState(), applied: { ok: true, checks: {} } };
    paint(result);
    if (result.error) flashButton(note + '失败', false);
    else if (result.applied) {
      const failed = Object.entries(result.applied.checks || {}).filter(([, v]) => !v).map(([k]) => k);
      /* 复核项可能一条都没列出（失败发生在复核之前，比如找不到调试端点），
         这时必须回落到 error 文本 —— 否则按钮上会只剩一个空的"未通过：" */
      const detail = failed.length ? failed.join(',') : (result.applied.error || '未知原因');
      const ok = Boolean(result.applied.ok);
      /* 缺少调试端口是可以补救的失败：把主按钮换成重启入口，1.4s 后就露出来 */
      pendingRelaunch = !ok && Boolean(result.applied.needsDebugPort);
      flashButton(ok ? '复核全绿' : '未通过：' + detail, ok, pendingRelaunch ? 1400 : 3200);
    } else if (result.removed) {
      flashButton(result.removed.changed ? '已撤下' : '未检测到皮肤', true);
    } else flashButton('完成', true);
  }

  /* 恢复默认路径：丢掉手动指定的 exe，按默认路径重新解析（并写进本机配置） */
  async function defaultTarget() {
    el('apply').textContent = '按默认路径解析…';
    const result = (await invoke('panel:defaults')) || demoState();
    paint(result);
    const candidates = ((result.resolved || {}).candidates) || [];
    flashButton(candidates.length ? '已用默认路径' : '默认路径下没找到', candidates.length > 0);
  }

  /* 手动指定：系统文件对话框选 exe，选完覆盖自动扫描的结果 */
  async function pickTarget() {
    el('apply').textContent = '等待选择文件…';
    const result = (await invoke('panel:pick-exe')) || demoState();
    if (result.canceled) { paint(result); flashButton('已取消', true); return; }
    paint(result);
    flashButton((result.saved || {}).saved ? '已保存 ZCode 路径' : '保存失败', Boolean((result.saved || {}).saved));
  }

  /* 重启并注入：会结束正在运行的 ZCode（连带里面的会话），所以必须是用户明确点这一步。
     过程中按钮上实时显示主进程转发来的进度（关闭中 / 启动中 / 注入中…），不然十几秒没有任何反应很像卡死。 */
  async function relaunchAndApply(id) {
    el('apply').textContent = '准备重启…';
    const result = (await invoke('panel:relaunch-apply', id)) || demoState();
    paint(result);
    const relaunched = result.relaunched || {};
    if (!relaunched.ok) {
      pendingRelaunch = false;
      const reason = String(relaunched.error || '未知原因');
      el('apply').title = reason;
      flashButton('重启失败：' + reason.slice(0, 60), false, 8000);
      return;
    }
    const applied = result.applied || {};
    const failed = Object.entries(applied.checks || {}).filter(([, v]) => !v).map(([k]) => k);
    const detail = failed.length ? failed.join(',') : (applied.error || '未知原因');
    const ok = Boolean(applied.ok);
    pendingRelaunch = !ok && Boolean(applied.needsDebugPort);
    flashButton(ok ? '已重启并注入' : '注入未通过：' + detail, ok, ok ? 3200 : 8000);
  }

  /* 主进程转发的重启进度：直接写在主按钮上 */
  if (ipcRenderer) {
    ipcRenderer.on('panel:progress', (_event, text) => {
      if (typeof text === 'string' && text) el('apply').textContent = text;
    });
  }

  /* 箭头 = 预选前后移动（到头即停，抽屉拉到底）；点格 = 预选那一格 */
  el('skin-prev').addEventListener('click', () => selectSkin(selIndex - 1));
  el('skin-next').addEventListener('click', () => selectSkin(selIndex + 1));
  el('pet-prev').addEventListener('click', () => act('panel:cycle-pet', [-1], '切换到上一个宠物'));
  el('pet-next').addEventListener('click', () => act('panel:cycle-pet', [1], '切换到下一个宠物'));
  document.querySelectorAll('#modes button').forEach((button) => {
    button.addEventListener('click', () => act('panel:set-mode', [button.dataset.mode], `切到${button.textContent.trim()}`));
  });
  el('apply').addEventListener('click', () => {
    const id = ((snapshot || {}).skins || [])[selIndex]?.id;
    if (pendingRelaunch) relaunchAndApply(id);
    else act('panel:apply', [id], '注入');
  });
  el('remove').addEventListener('click', () => act('panel:remove', [], '撤下'));
  el('target-default').addEventListener('click', defaultTarget);
  el('target-pick').addEventListener('click', pickTarget);
  window.addEventListener('resize', () => { if (snapshot) paint(snapshot); });

  // 无系统标题栏，窗口按钮走 IPC
  el('win-min').addEventListener('click', () => invoke('panel:window', 'minimize'));
  el('win-close').addEventListener('click', () => invoke('panel:window', 'close'));

  refresh();
</script>
</body>
</html>
